version: '3.8'

services:
  # Main API with full ML support (XGBoost + PAT)
  api:
    build:
      context: .
      args:
        INSTALL_ML: "true"  # Full ML support
    image: big-mood-detector:latest
    container_name: mood-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKERS=${WORKERS:-4}
      - PORT=8000
      # ML model paths
      - XGBOOST_MODEL_PATH=/app/model_weights/xgboost/converted
      - PAT_MODEL_PATH=/app/model_weights/pat
      # Optional services
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      # Cross-platform compatible paths
      - ./data:/app/data
      - ./model_weights:/app/model_weights:ro
      - ./config:/app/config:ro
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # Longer for ML models to load
    restart: unless-stopped
    networks:
      - mood-network
    deploy:
      resources:
        limits:
          memory: 8G  # Need more for PyTorch/TensorFlow
        reservations:
          memory: 4G

  # Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    container_name: mood-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mood-network

  # PostgreSQL (optional - use with --profile db)
  postgres:
    image: postgres:16-alpine
    container_name: mood-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bigmood}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-bigmood}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigmood}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mood-network
    profiles:
      - db

  # Lightweight worker (optional - use with --profile worker)
  worker:
    build:
      context: .
      args:
        INSTALL_ML: "false"  # XGBoost only for workers
    image: big-mood-detector:worker
    container_name: mood-worker
    command: ["worker"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379
      - XGBOOST_MODEL_PATH=/app/model_weights/xgboost/converted
    volumes:
      - ./data:/app/data
      - ./model_weights:/app/model_weights:ro
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mood-network
    profiles:
      - worker

volumes:
  logs:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  mood-network:
    driver: bridge